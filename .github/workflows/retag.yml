name: Retag

on:
  workflow_dispatch:
    inputs:
      mapping:
        description: "改行区切りの '<tag> <sha>'"
        required: true

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Move tags via git push (force)
        env:
          MAPPING: ${{ inputs.mapping }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$MAPPING" | while read -r tag sha; do
            [ -z "$tag" ] && continue
            echo "=== $tag -> $sha ==="
            git cat-file -e "${sha}^{commit}" 2>/dev/null && echo "object present" || echo "object MISSING"
            git tag -f "$tag" "$sha"
            git push -f origin "refs/tags/${tag}" && echo "PUSH ok" || echo "PUSH FAILED"
          done
