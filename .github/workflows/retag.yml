name: Retag

on:
  workflow_dispatch:
    inputs:
      mapping:
        description: "改行区切りの '<tag> <sha>'"
        required: true

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Move tags to rewritten commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAPPING: ${{ inputs.mapping }}
        run: |
          printf '%s\n' "$MAPPING" | while read -r tag sha; do
            [ -z "$tag" ] && continue
            echo "=== retag $tag -> $sha ==="
            # 参照が存在すれば PATCH（force）、無ければ create で作成
            if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" >/dev/null 2>&1; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -f sha="${sha}" -F force=true \
                && echo "PATCH ok" || echo "PATCH FAILED"
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${sha}" \
                && echo "CREATE ok" || echo "CREATE FAILED"
            fi
          done
