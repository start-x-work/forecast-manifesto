name: Retag

# 履歴書き換え後、軽量タグを新コミットへ付け替える一時ワークフロー。
# git のタグ push がエグレスポリシーで拒否されるため、runner 側の API 経由で移動する。
# 入力はタグと新SHA（ハッシュのみ・機微情報なし）。実行後に削除する。
on:
  workflow_dispatch:
    inputs:
      mapping:
        description: "改行区切りの '<tag> <sha>'"
        required: true

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Move tags to rewritten commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAPPING: ${{ inputs.mapping }}
        run: |
          set -e
          printf '%s\n' "$MAPPING" | while read -r tag sha; do
            [ -z "$tag" ] && continue
            printf 'retag %s -> %s ... ' "$tag" "$sha"
            if gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -f sha="${sha}" -F force=true >/dev/null 2>&1; then
              echo "ok"
            else
              echo "FAILED"
            fi
          done
